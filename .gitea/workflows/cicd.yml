name: MES Production Dashboard CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mes-production-dashboard-client
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    env:
      SITE_NAME: 'MESProductionDashboardClient'
      DEPLOY_ROOT: 'D:\Senao\MESProductionDashboard\MESProductionDashboardClient'
      RELEASE_DIR: 'D:\Senao\MESProductionDashboard\MESProductionDashboardClient\release'
      BACKUP_ROOT: 'D:\Senao\MESProductionDashboard\MESProductionDashboardClient\backup'
      CI_ROOT: 'D:\Senao\CI\MESProductionDashboardClient'
      PUBLISH_DIR: 'D:\Senao\CI\MESProductionDashboardClient\publish'
      KEEP_BACKUPS: '10'
      GITEA_BASE_URL: 'https://10.1.200.200:83'

    steps:
      - name: Checkout
        uses: https://10.1.200.200:83/K00136/ci-actions-checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify checkout
        run: |
          $ErrorActionPreference = 'Stop'

          $status = git status --porcelain
          if ($status) {
            throw "Checkout is not clean: $status"
          }

          $sha = (git rev-parse HEAD).Trim()
          if (!$sha) {
            throw "Cannot resolve HEAD commit."
          }

          Write-Host "Commit: $sha"
          Write-Host "Workspace: $PWD"

      - name: Check Node.js and npm
        run: |
          $ErrorActionPreference = 'Stop'

          node --version
          if ($LASTEXITCODE -ne 0) {
            throw "Node.js is unavailable."
          }

          npm --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm is unavailable."
          }

          if (!(Test-Path "package.json")) {
            throw "package.json not found."
          }

          if (!(Test-Path "package-lock.json")) {
            throw "package-lock.json not found; npm ci requires a lockfile."
          }

      # Diagnostic step: kiểm tra registry trước khi cài dependencies.
      - name: Diagnose npm registry
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== npm environment ==="
          node --version
          npm --version
          Write-Host "Registry:"
          npm config get registry
          Write-Host "Cache:"
          npm config get cache

          Write-Host "=== Check npm registry connectivity ==="
          npm ping --fetch-timeout=15000

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot reach npm registry. Check DNS, proxy, firewall or registry configuration."
          }

          Write-Host "npm registry is reachable."

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Starting npm ci..."
          npm ci --verbose --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed with exit code $LASTEXITCODE."
          }

          Write-Host "npm ci completed successfully."

      - name: Build Vite application
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Starting Vite build..."
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "Vite build failed."
          }

          $dist = Join-Path $PWD "dist"

          if (!(Test-Path $dist -PathType Container)) {
            throw "Vite output directory not found: $dist"
          }

          if (!(Test-Path (Join-Path $dist "index.html"))) {
            throw "Vite output missing: dist/index.html"
          }

          $assets = Join-Path $dist "assets"
          if (!(Test-Path $assets -PathType Container)) {
            throw "Vite output missing dist/assets. Check vite.config."
          }

          Write-Host "Vite build validated: $dist"

      - name: Bump version and create Gitea Release
        id: versioning
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repo     = $env:REPO_NAME
          $baseUrl  = $env:GITEA_BASE_URL
          $headers  = @{
            Authorization  = "token $env:GITEA_TOKEN"
            'Content-Type' = 'application/json'
          }

          # Lấy tag mới nhất từ Gitea API
          $tagsUrl = "$baseUrl/api/v1/repos/$repo/tags?limit=50&page=1"
          $tags = Invoke-RestMethod `
            -Method Get `
            -Uri $tagsUrl `
            -Headers $headers `
            -SkipCertificateCheck

          # Lọc tag dạng vX.Y.Z, lấy cái lớn nhất
          $semverTags = $tags |
            Where-Object { $_.name -match '^v(\d+)\.(\d+)\.(\d+)$' } |
            Sort-Object {
              $m = $_.name -match '^v(\d+)\.(\d+)\.(\d+)$'
              [int]$Matches[1] * 1000000 + [int]$Matches[2] * 1000 + [int]$Matches[3]
            } -Descending

          if ($semverTags.Count -eq 0) {
            # Chưa có tag nào → bắt đầu từ v1.0.0
            $newTag = 'v1.0.0'
            Write-Host "No existing semver tag found. Starting at $newTag"
          } else {
            $latest = $semverTags[0].name
            Write-Host "Latest tag: $latest"

            $null = $latest -match '^v(\d+)\.(\d+)\.(\d+)$'
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]

            # Tự động bump patch
            $newTag = "v${major}.${minor}.$($patch + 1)"
            Write-Host "New tag: $newTag"
          }

          $sha   = (git rev-parse HEAD).Trim()
          $short = (git rev-parse --short HEAD).Trim()
          $stamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          # Zip dist để đính kèm release
          $zipName = "MESProductionDashboardClient-${newTag}.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -Force
          Write-Host "Packaged: $zipName"

          # Tạo Gitea Release
          $releaseBody = @{
            tag_name         = $newTag
            target_commitish = $sha
            name             = "Release $newTag"
            body             = "**Commit:** $sha`n**Built:** $stamp"
            draft            = $false
            prerelease       = $false
          } | ConvertTo-Json

          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "$baseUrl/api/v1/repos/$repo/releases" `
            -Headers $headers `
            -Body $releaseBody `
            -SkipCertificateCheck

          Write-Host "Release created: $($release.id)  -  $newTag"

          # Upload artifact zip
          $uploadUrl = "$baseUrl/api/v1/repos/$repo/releases/$($release.id)/assets?name=$zipName"

          Invoke-RestMethod `
            -Method Post `
            -Uri $uploadUrl `
            -Headers @{ Authorization = "token $env:GITEA_TOKEN" } `
            -InFile $zipName `
            -ContentType 'application/zip' `
            -SkipCertificateCheck

          Write-Host "Artifact uploaded: $zipName"

          # Expose tag ra cho các step sau
          "RELEASE_TAG=$newTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare publish artifact
        run: |
          $ErrorActionPreference = 'Stop'

          $dist    = Join-Path $PWD "dist"
          $publish = $env:PUBLISH_DIR

          New-Item -ItemType Directory -Force $env:CI_ROOT | Out-Null

          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          New-Item -ItemType Directory -Force $publish | Out-Null

          Copy-Item (Join-Path $dist "*") -Destination $publish -Recurse -Force

          $sha         = (git rev-parse HEAD).Trim()
          $short       = (git rev-parse --short HEAD).Trim()
          $stamp       = Get-Date -Format "yyyyMMdd_HHmmss"
          $tag         = "${{ steps.versioning.outputs.RELEASE_TAG }}"
          $releaseName = "${stamp}_${short}"

          @(
            "commit=$sha"
            "built=$stamp"
            "version=$tag"
            "release=$releaseName"
          ) | Set-Content -Path (Join-Path $publish "version.txt") -Encoding UTF8

          Set-Content `
            -Path (Join-Path $env:CI_ROOT "ci_release_name.txt") `
            -Value $releaseName `
            -Encoding UTF8 -NoNewline

          if (!(Test-Path (Join-Path $publish "index.html"))) {
            throw "Publish artifact missing index.html."
          }

          if (!(Test-Path (Join-Path $publish "assets") -PathType Container)) {
            throw "Publish artifact missing assets directory."
          }

          if (!(Test-Path (Join-Path $publish "version.txt"))) {
            throw "Publish artifact missing version.txt."
          }

          Write-Host "Publish artifact validated. Version: $tag"

      - name: Deploy to IIS with automatic rollback
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module WebAdministration -ErrorAction Stop

          $siteName    = $env:SITE_NAME
          $publish     = $env:PUBLISH_DIR
          $releaseDir  = $env:RELEASE_DIR
          $backupRoot  = $env:BACKUP_ROOT
          $ciRoot      = $env:CI_ROOT

          $site = Get-Website -Name $siteName -ErrorAction Stop
          if (!$site) {
            throw "IIS site '$siteName' does not exist."
          }

          $appPool = [string]$site.applicationPool
          if ([string]::IsNullOrWhiteSpace($appPool)) {
            throw "Cannot determine application pool for $siteName."
          }

          $null = Get-Item "IIS:\AppPools\$appPool" -ErrorAction Stop

          $currentPath = [Environment]::ExpandEnvironmentVariables([string]$site.physicalPath)

          if (!(Test-Path (Join-Path $publish "index.html"))) {
            throw "Publish artifact is missing index.html."
          }

          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          New-Item -ItemType Directory -Force $backupRoot | Out-Null

          $releaseName = (
            Get-Content -LiteralPath (Join-Path $ciRoot "ci_release_name.txt") -Raw
          ).Trim()

          $backupStamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupPath  = Join-Path $backupRoot "${backupStamp}_${releaseName}"

          $hasPreviousFiles = $false
          $iisTouched       = $false
          $deploymentSucceeded = $false

          function Get-SmokeTarget {
            param([string]$Name)

            $bindings = @(Get-WebBinding -Name $Name)
            if ($bindings.Count -eq 0) {
              throw "No IIS bindings found for $Name."
            }

            $preferred = $bindings |
              Where-Object { $_.bindingInformation -match '^[^:]*:[0-9]+:$' } |
              Sort-Object { if ($_.protocol -eq 'http') { 0 } else { 1 } } |
              Select-Object -First 1
            if (-not $preferred) {
              $preferred = $bindings |
                Sort-Object { if ($_.protocol -eq 'http') { 0 } else { 1 } } |
                Select-Object -First 1
            }

            $parts      = $preferred.bindingInformation.Split(':')
            $ip         = $parts[0]
            $port       = $parts[1]
            $hostHeader = $parts[2]

            $connectHost = $ip
            if ([string]::IsNullOrWhiteSpace($connectHost) -or
                $connectHost -eq '*' -or
                $connectHost -eq '0.0.0.0') {
              $connectHost = 'localhost'
            }

            if (![string]::IsNullOrWhiteSpace($hostHeader)) {
              $connectHost = $hostHeader
            }

            return @{
              Url     = "$($preferred.protocol)://${connectHost}:$port/"
              IsHttps = ($preferred.protocol -eq 'https')
            }
          }

          function Test-SiteHttp {
            param([string]$Url, [bool]$IsHttps)

            for ($i = 1; $i -le 12; $i++) {
              try {
                $curlArgs = @('-sS', '-o', 'NUL', '-w', '%{http_code}', '--max-time', '15')
                if ($IsHttps) { $curlArgs += '-k' }
                $curlArgs += $Url

                $response = & curl.exe @curlArgs
                $curlExit = $LASTEXITCODE
                $code     = ([string]$response).Trim()

                Write-Host "Smoke test attempt ${i}: HTTP $code"

                if ($curlExit -eq 0 -and $code -eq '200') { return $true }
              }
              catch {
                Write-Host "Smoke test attempt ${i} failed: $($_.Exception.Message)"
              }

              Start-Sleep -Seconds 5
            }

            return $false
          }

          function Restore-Backup {
            param(
              [string]$SourceBackup,
              [string]$TargetDir,
              [string]$Pool,
              [string]$Site
            )

            Write-Host "Restoring backup from $SourceBackup to $TargetDir..."

            Stop-Website    -Name $Site -ErrorAction SilentlyContinue
            Stop-WebAppPool -Name $Pool -ErrorAction SilentlyContinue

            for ($w = 1; $w -le 15; $w++) {
              Start-Sleep -Seconds 2
              if ((Get-WebAppPoolState -Name $Pool).Value -eq 'Stopped') { break }
            }

            if (Test-Path $SourceBackup) {
              Get-ChildItem -LiteralPath $TargetDir -Force | Remove-Item -Recurse -Force
              Copy-Item (Join-Path $SourceBackup "*") -Destination $TargetDir -Recurse -Force
            }

            Set-ItemProperty "IIS:\Sites\$Site" -Name physicalPath -Value $TargetDir

            Start-WebAppPool -Name $Pool
            $poolStarted = $false
            for ($w = 1; $w -le 10; $w++) {
              Start-Sleep -Seconds 2
              if ((Get-WebAppPoolState -Name $Pool).Value -eq 'Started') {
                $poolStarted = $true; break
              }
            }
            if (-not $poolStarted) {
              throw "Backup restored, but application pool failed to start."
            }

            Start-Website -Name $Site
            if ((Get-Website -Name $Site).State -ne 'Started') {
              throw "Backup restored, but IIS website failed to start."
            }

            $target = Get-SmokeTarget -Name $Site
            if (!(Test-SiteHttp -Url $target.Url -IsHttps $target.IsHttps)) {
              throw "Restored backup did not pass the HTTP smoke test."
            }

            Write-Host "Rollback completed successfully. Site responds with HTTP 200."
          }

          try {
            # 1. Back up current release files if present
            $existingItems = @(Get-ChildItem -LiteralPath $releaseDir -Force)
            if ($existingItems.Count -gt 0) {
              $hasPreviousFiles = $true
              New-Item -ItemType Directory -Force $backupPath | Out-Null
              foreach ($item in $existingItems) {
                Copy-Item -LiteralPath $item.FullName -Destination $backupPath -Recurse -Force
              }

              $rollbackInfo = [ordered]@{
                site                 = $siteName
                applicationPool      = $appPool
                previousPhysicalPath = $currentPath
                targetPhysicalPath   = $releaseDir
                backupPath           = $backupPath
                commit               = (git rev-parse HEAD).Trim()
                created              = (Get-Date).ToString('o')
              }
              $rollbackInfo |
                ConvertTo-Json -Depth 5 |
                Set-Content (Join-Path $backupPath "rollback.json") -Encoding UTF8

              Write-Host "Current release backed up to: $backupPath"
            } else {
              Write-Host "No existing files in $releaseDir to back up."
            }

            # 2. Stop site & pool before updating files in release directory
            $iisTouched = $true

            Stop-Website    -Name $siteName -ErrorAction SilentlyContinue
            Stop-WebAppPool -Name $appPool -ErrorAction SilentlyContinue

            for ($w = 1; $w -le 15; $w++) {
              Start-Sleep -Seconds 2
              if ((Get-WebAppPoolState -Name $appPool).Value -eq 'Stopped') { break }
            }

            # 3. Clean and deploy new files to release directory
            Get-ChildItem -LiteralPath $releaseDir -Force | Remove-Item -Recurse -Force
            Copy-Item (Join-Path $publish "*") -Destination $releaseDir -Recurse -Force

            # 4. Grant IIS AppPool permissions
            $aclUser = "IIS AppPool\$appPool"
            & icacls.exe $releaseDir /grant "${aclUser}:(OI)(CI)RX" /T /C
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to grant IIS read permissions on release directory."
            }

            if (!(Test-Path (Join-Path $releaseDir "index.html"))) {
              throw "Release directory is missing index.html after copy."
            }

            if (!(Test-Path (Join-Path $releaseDir "version.txt"))) {
              throw "Release directory is missing version.txt after copy."
            }

            # 5. Ensure IIS physical path points to release directory
            $configuredPath = [Environment]::ExpandEnvironmentVariables([string](Get-Website -Name $siteName).physicalPath)
            if ($configuredPath.TrimEnd('\') -ne $releaseDir.TrimEnd('\')) {
              Write-Host "Updating IIS physicalPath from '$configuredPath' to '$releaseDir'..."
              Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $releaseDir
            }

            # 6. Start Application Pool & Website
            Start-WebAppPool -Name $appPool
            $poolStarted = $false
            for ($w = 1; $w -le 10; $w++) {
              Start-Sleep -Seconds 2
              if ((Get-WebAppPoolState -Name $appPool).Value -eq 'Started') {
                $poolStarted = $true; break
              }
            }
            if (-not $poolStarted) {
              throw "Application pool failed to start."
            }

            Start-Website -Name $siteName
            if ((Get-Website -Name $siteName).State -ne 'Started') {
              throw "IIS site failed to start."
            }

            # 7. Smoke test HTTP 200
            $target = Get-SmokeTarget -Name $siteName
            Write-Host "Smoke testing $($target.Url)..."

            if (!(Test-SiteHttp -Url $target.Url -IsHttps $target.IsHttps)) {
              throw "New release did not return HTTP 200 during smoke test."
            }

            $deploymentSucceeded = $true
            Write-Host "Deployment successful to: $releaseDir"
          }
          catch {
            $deployError = $_.Exception.Message
            Write-Host "Deployment error: $deployError"

            if ($iisTouched -and $hasPreviousFiles) {
              try {
                Restore-Backup -SourceBackup $backupPath -TargetDir $releaseDir -Pool $appPool -Site $siteName
              }
              catch {
                throw "DEPLOYMENT FAILED: $deployError. ROLLBACK ALSO FAILED: $($_.Exception.Message). Manual IIS recovery is required."
              }
            }

            throw "Deployment failed. $(if ($iisTouched -and $hasPreviousFiles) { 'Rollback completed.' } else { 'Live site untouched or no previous files existed.' }) Reason: $deployError"
          }
          finally {
            if (!$deploymentSucceeded) {
              Write-Host "Deployment did not succeed; check logs and artifacts."
            }
          }

          # 8. Prune old backups (keep latest N)
          $keepBackups = [int]$env:KEEP_BACKUPS

          $backups = @(
            Get-ChildItem -LiteralPath $backupRoot -Directory | Sort-Object Name -Descending
          )

          foreach ($old in ($backups | Select-Object -Skip $keepBackups)) {
            Remove-Item -LiteralPath $old.FullName -Recurse -Force
            Write-Host "Removed old backup: $($old.Name)"
          }

          Write-Host "Deployment process completed successfully."
